<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Creepster&display=swap"
        rel="stylesheet">
    <title>MonstroLogo</title>
</head>

<body>
    <header>
        <h2>MonstroLogo</h2>
    </header>

    <section id="section_inicial" class="">
        <img src="logo-monstrologo.png" alt="" id="foto-logo">
        <h2>Bem vindo ao catálogo de monstros.</h2>
    </section>


    <section id="section_form" class="esconder_elemento">
        <div id="form">
            <h3>Adicione seu item preferido ou escolha um.</h3>
            <div class="container_inputs">
                <label for="">Nome</label>
                <input id="input_nome" type="text">
            </div>

            <div class="container_inputs">
                <label for="">Cor</label>
                <input id="input_cor" type="text">
            </div>

            <div class="container_inputs">
                <label for="">Custo</label>
                <input id="input_custo" type="text">
            </div>

            <div class="container_inputs">
                <label for="">Origem</label>
                <input id="input_origem" type="text">
            </div>

            <div class="container_inputs">
                <label for="">Tipo de monstro dono do item</label>
                <select id="input_monstro">
                    <option value="">Selecione</option>
                    <option>Vampiro</option>
                    <option>Lobisomem</option>
                    <option>Bruxa</option>
                    <option>Zumbi</option>
                    <option>Fada</option>
                    <option>Frankenstein</option>
                    <option>Slime</option>
                    <option>Sereia</option>
                    <option>Goblin</option>
                    <option>Fantasma</option>
                    <option>Demônio</option>
                </select>
            </div>



            <div class="container_inputs">
                <label for="">ID</label>
                <input id="input_id" type="text">
            </div>

            <div id="container_button">
                <button onclick="adicionar_item()" id="botao_adicionar">Adicionar item</button>
                <button onclick="mostrar_itens()" id="botao_mostrar">Mostrar bestiário</button>
                <button onclick="buscar_item()" id="botao_buscar">Caçar item</button>
                <button onclick="cacar_monstro()" id="botao_cacar">Caçar monstro</button>
                <button onclick="editar_item()" id="botao_editar">Mutar item</button>
                <button onclick="remover_item()" id="botao_remover">Expurgar item</button>
                <button onclick="salvar_itens()" id="botao_salvar">Salvar itens</button>
                <button onclick="carregar_itens()" id="botao_carregar">Carregar itens</button>

                <!-- botão feito para adicionar itens de forma rápida -->
                <!-- <button onclick="teste()" id="botao_teste">Teste</button>"" -->
            </div>
        </div>

        <div id="mensagem"></div>
        <div id="div_cards"></div>
    </section>

    <script src="script.js"></script>
</body>

</html>
